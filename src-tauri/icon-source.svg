<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Valence's mark — the header's hexagon, a central atom and three bonded
       neighbours — on a dark tile so it reads on light and dark tab bars and
       taskbars alike. Colours are the Graphite theme's accent and text tokens.
       The ring is heavier than the header's: at 16 px a hairline vanishes.
       Also the source of the desktop icons (src-tauri/icon-source.svg). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181c23"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <g transform="translate(512 512) scale(32) translate(-13 -13)">
    <polygon points="13,2 23,7.5 23,18.5 13,24 3,18.5 3,7.5" fill="none" stroke="#7aa7ff" stroke-width="2.1" stroke-linejoin="round"/>
    <circle cx="13" cy="13" r="3.4" fill="#7aa7ff"/>
    <circle cx="13" cy="2.6" r="2" fill="#e6e8eb"/>
    <circle cx="22.4" cy="18.2" r="2" fill="#e6e8eb"/>
    <circle cx="3.6" cy="18.2" r="2" fill="#e6e8eb"/>
  </g>
</svg>
